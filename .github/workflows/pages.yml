name: Pages

# The GitHub Pages site lives entirely under site/ and never touches dist/,
# src/, or Invoke-WtChecks.ps1 - it has nothing to do with the PowerShell
# build gate in ci.yml/release.yml. Deploys from main only, same "main is
# the published state" convention release.yml uses, plus a manual trigger
# for a redeploy that needs no new commit.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two Pages deployments must never race each other; a superseded one is not
# worth finishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # site/ is already the built artifact - there is no separate build
      # step, no Node/npm, nothing beyond the static files themselves.
      - name: Upload the site/ directory
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
